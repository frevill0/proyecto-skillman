<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal PDP Clientes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Concepto: un prototipo con tres vistas (celular del cliente, panel del administrador, plan). Verde bosque sobre grises verdosos; ocre solo para "pendiente/nuevo". */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F4F7F6; --ink:#12201D; --muted:#586A65; --line:#D6DEDB;
  --brand:#0E5A4F; --brand-ink:#FFFFFF; --brand-soft:#DCEBE7; --accent:#9A6410; --accent-soft:#F6E8CC;
  --ok:#2A7A4B; --danger:#A93A2E; --frame:#1A2522; --shadow:0 12px 40px rgba(18,32,29,.14);
  --f-display:'Sora',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1412; --surface:#142320; --surface-2:#1A2C28; --ink:#E6EFEC; --muted:#93A8A1; --line:#27393A;
  --brand:#46B9A2; --brand-ink:#04211C; --brand-soft:#173B35; --accent:#E3B04E; --accent-soft:#3A2D12;
  --ok:#5CC28A; --danger:#E5857A; --frame:#050A09; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0C1412; --surface:#142320; --surface-2:#1A2C28; --ink:#E6EFEC; --muted:#93A8A1; --line:#27393A;
  --brand:#46B9A2; --brand-ink:#04211C; --brand-soft:#173B35; --accent:#E3B04E; --accent-soft:#3A2D12;
  --ok:#5CC28A; --danger:#E5857A; --frame:#050A09; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);
  padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}

/* Barra superior */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.badge-demo{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 8px;border-radius:6px}

/* Vista celular */
.stage{display:grid;grid-template-columns:1fr;gap:28px;align-items:start}
@media (min-width:880px){.stage{grid-template-columns:minmax(0,1fr) 380px minmax(0,1fr)}}
.notes{display:flex;flex-direction:column;gap:14px;min-width:0}
.notes h3{margin:0;font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.notes p{margin:0;color:var(--ink)}
.note{padding-left:14px;border-left:2px solid var(--line)}
.note b{font-family:var(--f-display);font-weight:600;display:block;margin-bottom:2px}
.phone{width:100%;max-width:380px;margin:0 auto;height:min(780px,calc(100dvh - 110px));min-height:600px;border-radius:40px;border:9px solid var(--frame);
  background:var(--surface);box-shadow:var(--shadow);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:480px){.phone{border-width:0;border-radius:22px;border:1px solid var(--line)}}
.statusbar{height:26px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font:500 11px var(--f-mono);color:var(--muted)}
.appbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px 12px;min-height:52px}
.appbar h2{margin:0;font:600 16px/1.2 var(--f-display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.scroll{flex:1;overflow-y:auto;padding:0 16px 20px;min-height:0}

/* Login */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:14px}
.login .logo{width:52px;height:52px;border-radius:16px}
.login h1{font:700 26px/1.1 var(--f-display);margin:8px 0 0;letter-spacing:-.02em}
.login p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:12px;border-radius:11px;font:inherit}
.btn{border:0;background:var(--brand);color:var(--brand-ink);padding:12px 16px;border-radius:12px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;border-radius:10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.fine{font-size:12px;color:var(--muted)}

/* Inicio */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:16px;margin-bottom:14px}
.hero small{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero strong{display:block;font:700 19px/1.15 var(--f-display);margin:4px 0 12px}
.hero .stats{display:flex;gap:18px}
.hero .stats div{font:600 20px var(--f-display);font-variant-numeric:tabular-nums}
.hero .stats span{display:block;font:400 11px var(--f-body);opacity:.85}
.search{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;margin-bottom:10px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.num{font:500 12px var(--f-mono);color:var(--brand);background:var(--brand-soft);border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .t span{font-size:12px;color:var(--muted)}
.row.empty .t b{color:var(--muted);font-weight:500}
.chev{color:var(--muted);flex:none}
.ftype{font:500 10px var(--f-mono);letter-spacing:.04em;border-radius:7px;min-width:38px;height:38px;display:grid;place-items:center;flex:none;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.ftype.pdf{color:var(--danger)} .ftype.xlsx{color:var(--ok)} .ftype.docx{color:var(--brand)} .ftype.pptx{color:var(--accent)}
.new{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:5px;margin-left:6px}

/* Visor */
.doc{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:18px 16px;position:relative;overflow:hidden;margin-bottom:12px}
.doc .org{font:500 10px var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.doc h3{font:600 15px/1.25 var(--f-display);margin:6px 0 12px}
.bar{height:7px;border-radius:4px;background:var(--line);margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:8px 0}
.grid i{height:20px;background:var(--line);border-radius:3px}
.grid i:nth-child(-n+5){background:var(--brand-soft)}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.boxes i{height:46px;border:1.5px dashed var(--line);border-radius:10px}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:500 11px var(--f-mono);color:var(--muted);opacity:.28;transform:rotate(-24deg);text-align:center;line-height:1.8}
.chip{display:inline-flex;gap:6px;align-items:center;font:500 11px var(--f-mono);background:var(--brand-soft);color:var(--brand);padding:4px 8px;border-radius:7px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* Panel admin */
.admin{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:880px){.admin{grid-template-columns:240px minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel h3{margin:0 0 10px;font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.client{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:10px;border-radius:12px;text-align:left}
.client[aria-current="true"]{background:var(--brand-soft)}
.client .av{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:600 12px var(--f-display);flex:none}
.client b{display:block;font-weight:600}
.client span{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px}
.kpi b{display:block;font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.subtabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:0;background:transparent;padding:8px 0;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n{font-variant-numeric:tabular-nums;color:var(--muted)}
.tblwrap{overflow-x:auto}
.switch{position:relative;width:42px;height:24px;border-radius:14px;border:0;background:var(--line);padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--brand-ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.upload{border:1.5px dashed var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:var(--surface-2)}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.steps li{color:var(--muted)} .steps li.done{color:var(--ink)} .steps li.done::before{content:"✓ ";color:var(--ok)}
.upload.over{border-color:var(--brand);background:var(--brand-soft)}
.pbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;width:0;background:var(--brand);transition:width .5s}
.pill{font:500 11px var(--f-mono);padding:3px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.pill.off{background:var(--surface-2);color:var(--muted)}
.userrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.userrow .av{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:600 12px var(--f-display);flex:none}
.userrow .t{flex:1;min-width:160px}
.userrow .t b{display:block;font-weight:600}
.userrow .t span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.invite{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.invite input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:9px 11px;border-radius:10px;font:inherit}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.log time{font:500 12px var(--f-mono);color:var(--muted);flex:none;min-width:46px}
.empty-state{padding:28px 12px;text-align:center;color:var(--muted)}

/* Plan */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{margin:0 0 8px;font:600 16px var(--f-display)}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.card.key{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.prop{display:flex;flex-direction:column;gap:30px;max-width:900px;margin:0 auto}
.prop section{min-width:0}
.p-h{margin:0 0 12px;font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.p-hero{background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:28px 24px}
.p-hero small{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.p-hero h2{margin:8px 0 10px;font:700 clamp(24px,5vw,36px)/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.p-hero p{margin:0;max-width:56ch;opacity:.92;font-size:16px}
.p-hero .actions{margin-top:18px}
.p-hero .btn{background:var(--surface);color:var(--ink)}
.p-hero .btn.ghost{background:transparent;color:var(--brand-ink);border:1px solid currentColor}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;counter-reset:s}
.flow li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 16px 58px;position:relative;display:flex;flex-direction:column;gap:4px}
.flow li::before{content:counter(s);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:600 14px var(--f-display)}
.flow li span{color:var(--muted)}
.devin{width:110px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:7px 9px;border-radius:9px;font:inherit}
.p-next{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.prop ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg></span>Portal PDP</div>
    <div class="tabs" role="tablist" aria-label="Vistas del prototipo">
      <button role="tab" aria-selected="true" data-view="app">Vista del cliente</button>
      <button role="tab" aria-selected="false" data-view="admin">Panel del administrador</button>
      <button role="tab" aria-selected="false" data-view="plan">Propuesta</button>
    </div>
    <span class="badge-demo">Prototipo con datos de ejemplo</span>
  </header>

  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  /* ---------- Datos de ejemplo (estructura real de la carpeta del cliente) ---------- */
  var F=function(n,t,s,d){return {name:n,type:t,size:s,date:d||'8 jul 2026'}};
  function sec(id,name,files){return {id:id,name:name,visible:true,files:files||[]}}
  function buildSections(){return [
    sec('01','Glosario y categorías',[F('Glosario PDP 2021','pdf','0,3 MB','12 jul 2026'),F('Catálogo de categorías de datos','jpg','0,3 MB','12 jul 2026'),F('Catálogo de titulares','jpg','0,2 MB','12 jul 2026'),F('Catálogo de encargados','jpg','0,3 MB','12 jul 2026'),F('Ley Orgánica de Protección de Datos Personales','pdf','7,7 MB','12 jul 2026')]),
    sec('02','Áreas, contextos y ámbitos',[F('Contextos, ámbitos y áreas','pdf','3,3 MB','8 jul 2026'),F('Ecosistema PDP: autoridad, RTD y DTD','pdf','0,4 MB','8 jul 2026'),F('Visión y GRC','pdf','1,9 MB','8 jul 2026')]),
    sec('03','Mapeo de PATD y PANSI',[F('PATD + RAT-MTGE','xlsx','0,3 MB','8 jul 2026'),F('Mapeo EET + PANSI','xlsx','2,7 MB','8 jul 2026')]),
    sec('04','Comunicados y ejercicio de derechos',[F('Anuncio de inicio a encargados de tratamiento','docx','20 KB','8 jul 2026'),F('Anuncio de inicio a socios','docx','23 KB','8 jul 2026')]),
    sec('05','Contratos y cláusulas',[F('Anexo de tratamiento de datos personales','docx','31 KB','8 jul 2026'),F('Anexo PDP y confidencialidad de empleados','docx','23 KB','8 jul 2026'),F('Contrato de encargo','docx','21 KB','8 jul 2026'),F('Cláusulas entre responsable y titular','docx','28 KB','8 jul 2026')]),
    sec('06','RAT, finalidad, licitud y MTGE',[F('RAT Cajero financiero','xlsx','67 KB','30 jun 2026'),F('RAT Asesor de crédito','xlsx','70 KB','30 jun 2026'),F('PATD + RAT-MTGE con listas organizadas','xlsx','0,3 MB','30 jun 2026')]),
    sec('07','Madurez organizacional y estado de la técnica',[F('Inventario de activos','xlsx','0,3 MB','30 jun 2026'),F('Evaluación EET + PANSI','xlsx','2,7 MB','30 jun 2026')]),
    sec('08','Evaluación de riesgos',[F('Matriz de derechos y libertades: reembolso médico','xlsx','0,4 MB','23 jun 2026'),F('Criterios de ponderación de impacto','jpg','1,0 MB','23 jun 2026'),F('Comparativo enfoque europeo vs. LOPDP','jpg','0,3 MB','23 jun 2026')]),
    sec('09','Política general PDP',[F('Subpolíticas PDP','docx','0,2 MB','8 jul 2026')]),
    sec('10','Plan PDP y declaración de aplicabilidad',[F('EIPD Salud ocupacional','xlsx','0,3 MB','19 jun 2026'),F('EIPD Cámaras de videovigilancia','xlsx','0,3 MB','3 jun 2026')]),
    sec('11','Rutinas PDP y estaciones autogestionadas',[F('Rutinas PDP y gestión de métricas','jpg','0,2 MB','8 jul 2026')]),
    sec('12','Procedimientos documentados',[F('Procedimiento ARCO','docx','32 KB','27 oct 2025'),F('Protocolo de crisis y resiliencia','docx','31 KB','27 oct 2025'),F('Revocatoria del consentimiento','docx','25 KB','27 oct 2025'),F('Trámites administrativos','docx','31 KB','27 oct 2025'),F('Documento 14: procedimientos documentados','docx','69 KB','8 nov 2023')]),
    sec('13','Programa de consciencia',[F('Programa de profesionalización del PANSI','pdf','144 KB','3 feb 2026'),F('Examen 1','pdf','129 KB','6 feb 2026'),F('La tríada PDP ecuatoriana','pptx','6,3 MB','13 feb 2026')]),
    sec('14','Programa de competencias',[F('Programa de profesionalización del PANSI','pdf','144 KB','3 feb 2026'),F('Examen 2','docx','48 KB','12 feb 2026'),F('Curso base LOPDP, módulo 1','pdf','5,5 MB','13 feb 2026')]),
    sec('15','Programa de auditorías',[]),
    sec('16','Programa de simulacros',[]),
    sec('17','Gestión de terceras partes',[]),
    sec('18','Evaluaciones técnico-jurídicas',[F('EIPD Salud ocupacional: informe','docx','5,9 MB','19 may 2026'),F('EIPD Cámaras: informe','docx','4,0 MB','19 may 2026')]),

  var ACR=['PDP','PATD','PANSI','RAT','MTGE','LOPDP','SPDP','EIPD','ATD','RTD','DTD','EET','GRC','COAC','ARCO','GDPR','CCPA','RGPD','LOPD'];
  var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var IGN=/^(~\$|\.ds_store$|thumbs\.db$|desktop\.ini$)/i;
  function pretty(s){
    if(/[a-záéíóúñ]/.test(s))return s;
    var t=s.toLowerCase();t=t.charAt(0).toUpperCase()+t.slice(1);
    return t.replace(/[^\s\-–()\/,.:]+/g,function(w){return ACR.indexOf(w.toUpperCase())>-1?w.toUpperCase():w});
  }
  function fdate(ms){var d=new Date(ms||Date.now());return d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear()}
  function fsize(b){return b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB'}
  function buildClient(items){
    var root=items[0].path.split('/')[0],secs={},order=[],stats={files:0,office:0};
    items.forEach(function(it){
      var parts=it.path.split('/').slice(1);
      if(!parts.length)return;
      var fname=parts[parts.length-1];
      if(IGN.test(fname))return;
      var secName=parts.length===1?'00 Documentos generales':parts[0];
      var sub=parts.length>2?parts.slice(1,-1).join(' / '):'';
      if(!secs[secName]){var m=secName.match(/^(\d+)[\s.\-_]+(.*)$/);secs[secName]={num:m?parseInt(m[1],10):0,name:pretty(m?m[2]:secName),files:[]};order.push(secName)}
      var dot=fname.lastIndexOf('.'),ext=dot>0?fname.slice(dot+1).toLowerCase():'file',base=dot>0?fname.slice(0,dot):fname;
      var f={name:pretty(base),type:ext,size:fsize(it.file.size),date:fdate(it.file.lastModified),sub:sub?pretty(sub):''};
      if(/^(jpe?g|png|gif|webp)$/.test(ext)){try{f.url=URL.createObjectURL(it.file)}catch(e){}}
      if(/^(docx?|xlsx?|pptx?)$/.test(ext))stats.office++;
      secs[secName].files.push(f);stats.files++;
    });
    var used={},list=order.map(function(k){return secs[k]}).sort(function(a,b){return a.num-b.num||a.name.localeCompare(b.name)}).map(function(s){
      var id=('0'+s.num).slice(-2),n=0,base=id;while(used[id]){n++;id=base+String.fromCharCode(96+n)}used[id]=1;
      return {id:id,name:s.name,visible:true,files:s.files};
    });

  }
  function readEntries(entry,path,out){
    return new Promise(function(res){
      if(entry.isFile){entry.file(function(f){out.push({path:path+entry.name,file:f});res()},function(){res()});return}
      var rd=entry.createReader(),all=[];
      (function loop(){rd.readEntries(function(es){
        if(!es.length){Promise.all(all.map(function(e){return readEntries(e,path+entry.name+'/',out)})).then(function(){res()})}
        else{all=all.concat(Array.prototype.slice.call(es));loop()}
      },function(){res()})})();
    });
  }
  function runImport(items){

        S.clients[idx].sections=built.sections;
        S.cur=idx;S.subtab='folders';S.app={screen:S.app.screen==='login'?'login':'home',sec:null,file:null,q:''};
        addLog('Administrador subió la carpeta «'+built.root+'»: '+built.stats.files+' documentos en '+built.sections.length+' secciones');
        renderAdmin();toast('Listo: '+built.sections.length+' secciones y '+built.stats.files+' documentos creados');
      },450);
    })();
  }
  function bindFolder(){
    var inp=document.getElementById('folder'),drop=document.getElementById('drop');
    if(!inp||!drop)return;
    drop.querySelector('label').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}});
    inp.addEventListener('change',function(){
      var fl=Array.prototype.slice.call(inp.files||[]);
      if(!fl.length)return;
      if(!fl[0].webkitRelativePath){toast('Este navegador no permite elegir carpetas. Usa un computador.');return}
      var items=fl.map(function(f){return {path:f.webkitRelativePath,file:f}});
      inp.value='';
      runImport(items);
    });
    ['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')})});
    drop.addEventListener('dragleave',function(){drop.classList.remove('over')});
    drop.addEventListener('drop',function(e){
      e.preventDefault();drop.classList.remove('over');
      var its=e.dataTransfer&&e.dataTransfer.items,en=null;
      if(its&&its.length){var x=its[0].webkitGetAsEntry&&its[0].webkitGetAsEntry();if(x&&x.isDirectory)en=x}
      if(!en){toast('Arrastra una carpeta, no archivos sueltos');return}
      var out=[];readEntries(en,'',out).then(function(){runImport(out)});
    });
  }

  function render(){

  document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){S.view=b.getAttribute('data-view');render()})});
